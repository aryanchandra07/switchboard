spring.application.name=gateway

# Local secrets live in gateway/.env (git-ignored). Copy .env.example to .env to get started.
# Real environment variables override anything in .env.
spring.config.import=optional:file:.env[.properties]

# --- Database (Postgres from infra/docker-compose.yml) ---
# The app talks to Postgres reactively through R2DBC; Flyway uses plain JDBC to create/upgrade tables.
switchboard.db.host=${SWITCHBOARD_DB_HOST:localhost}
switchboard.db.port=${SWITCHBOARD_DB_PORT:5433}
switchboard.db.name=${SWITCHBOARD_DB_NAME:switchboard}
spring.r2dbc.url=r2dbc:postgresql://${switchboard.db.host}:${switchboard.db.port}/${switchboard.db.name}
spring.r2dbc.username=${SWITCHBOARD_DB_USER:switchboard}
spring.r2dbc.password=${SWITCHBOARD_DB_PASSWORD:switchboard}
spring.flyway.url=jdbc:postgresql://${switchboard.db.host}:${switchboard.db.port}/${switchboard.db.name}
spring.flyway.user=${spring.r2dbc.username}
spring.flyway.password=${spring.r2dbc.password}

# --- Redis (from infra/docker-compose.yml): rate-limit counters and today's/this month's spend ---
spring.data.redis.host=${SWITCHBOARD_REDIS_HOST:localhost}
spring.data.redis.port=${SWITCHBOARD_REDIS_PORT:6379}
spring.data.redis.timeout=500ms

# --- Login tokens (JWT) ---
# Secret used to sign login tokens: at least 32 random characters. Required; no default on purpose.
switchboard.jwt.secret=${SWITCHBOARD_JWT_SECRET}
switchboard.jwt.ttl=8h

# --- Provider-key encryption ---
# Master key for AES-256-GCM: base64 of 32 random bytes. Required; no default on purpose.
# If it is lost, stored provider keys can't be decrypted and must be entered again.
switchboard.crypto.master-key=${SWITCHBOARD_MASTER_KEY}

# --- First admin account ---
# Created on startup only if no admin exists yet (invite-only: there is no public sign-up).
switchboard.admin.email=${SWITCHBOARD_ADMIN_EMAIL:}
switchboard.admin.password=${SWITCHBOARD_ADMIN_PASSWORD:}

# --- Default limits for newly invited members (the admin can change them per member) ---
switchboard.members.defaults.daily-budget-usd=1.00
switchboard.members.defaults.monthly-budget-usd=20.00
switchboard.members.defaults.rpm-limit=20
switchboard.members.defaults.allowed-models=llama3.2

# --- Retries, circuit breaker and failover (FR-11) ---
# A failing model is tried up to max-attempts times (only for errors that may go away), then the gateway
# moves on to the fallback models, in order, skipping any the member isn't allowed to use.
switchboard.failover.max-attempts=2
switchboard.failover.retry-wait=200ms
switchboard.failover.fallback-models=llama3.2
# If at least 50% of the last 10 calls to a provider failed, stop calling it for 30 s (fail fast).
switchboard.failover.breaker-window=10
switchboard.failover.breaker-failure-rate=50
switchboard.failover.breaker-open-for=30s

# --- Mock provider: instant fake replies for load tests and failover tests (model "mock" or "mock-...") ---
switchboard.mock.enabled=true
switchboard.mock.latency=0ms
switchboard.mock.failure-rate=0.0

# --- Claude (Anthropic): any model named "claude-..." ---
# OFF by default so the project is completely free: claude-... models are refused and hidden,
# and Anthropic is never contacted. Set SWITCHBOARD_ANTHROPIC_ENABLED=true (and store a key) to use Claude.
# The API key is NOT here: the admin stores it, encrypted, via PUT /admin/providers/anthropic.
switchboard.anthropic.enabled=${SWITCHBOARD_ANTHROPIC_ENABLED:false}
switchboard.anthropic.base-url=https://api.anthropic.com
switchboard.anthropic.timeout=120s
switchboard.anthropic.default-max-tokens=16000
switchboard.anthropic.max-max-tokens=16000
# USD per 1M tokens (Anthropic list prices, Nov 2026). Only models listed here can be used,
# so every Claude call has a known cost that counts against member budgets.
switchboard.anthropic.prices.claude-haiku-5-5.input=0.10
switchboard.anthropic.prices.claude-haiku-5-5.output=0.50
switchboard.anthropic.prices.claude-sonnet-5-5.input=2.00
switchboard.anthropic.prices.claude-sonnet-5-5.output=10.00
switchboard.anthropic.prices.claude-opus-5-5.input=4.00
switchboard.anthropic.prices.claude-opus-5-5.output=20.00

# --- Ollama (local models) ---
switchboard.ollama.base-url=${SWITCHBOARD_OLLAMA_BASE_URL:http://localhost:11434}
# Model used when the client sends "model": "auto" (until Person B's router service exists).
switchboard.ollama.default-model=llama3.2
# How long to wait for Ollama. The first call after startup can be slow while the model loads.
switchboard.ollama.timeout=120s
