# Settings used by tests (@ActiveProfiles("test")). Test-only values, not real secrets.
switchboard.jwt.secret=test-secret-for-unit-tests-only-0123456789abcdef
switchboard.jwt.ttl=1h
switchboard.admin.email=Admin@Test.Local
switchboard.admin.password=test-admin-password-123
switchboard.crypto.master-key=dGVzdC1tYXN0ZXIta2V5LTMyLWJ5dGVzLWxvbmctISE=

# Failover in tests: retry instantly, and a breaker that never opens (tests share one context)
switchboard.failover.retry-wait=0ms
switchboard.failover.breaker-window=100000

# Redis: production fails fast at 500 ms; tests run many containers at once, so allow more time
spring.data.redis.timeout=5s
